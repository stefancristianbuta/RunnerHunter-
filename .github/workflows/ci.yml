name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check server/index.js
      - run: npm run build
      - run: |
          node server/index.js > /tmp/runnerhunter.log 2>&1 &
          pid=$!
          sleep 5
          curl -fsS http://127.0.0.1:10000/health
          curl -fsS http://127.0.0.1:10000/api/status
          kill $pid || true
